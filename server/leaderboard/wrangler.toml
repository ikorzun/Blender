name = "blendo-lb"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ⛔ workers.dev ВЫКЛЮЧЕН НАМЕРЕННО: иначе у сервиса остаётся ВТОРОЙ публичный
# адрес на *.workers.dev — тот самый, который режут школьные и корпоративные
# сети. Один адрес = один путь, который проверяет смоук.
# ⚠️⚠️ КЛЮЧ ВЕРХНЕГО УРОВНЯ И ОБЯЗАН СТОЯТЬ ДО ЛЮБОГО [заголовка]: в TOML всё,
# что идёт после заголовка таблицы, принадлежит ЕЙ. Поставленный ниже, он
# дважды уехал не туда — сперва в [[routes]], потом в [triggers], и Cloudflare
# ругался на «неизвестное поле» совсем в другом месте, чем была ошибка.
workers_dev = false

# ⚠️ БИНДИНГ ОДИН — только D1. KV не заводим: бесплатный тариф даёт 1000
# записей в сутки (при тысяче активных игроков выбирается за час), и порядка
# в KV нет — позицию пришлось бы считать вычиткой всего списка в память.
[[d1_databases]]
binding = "DB"
database_name = "blendo-lb"
database_id = "62ffb3d5-70dd-4228-a1ea-440fe00a5532"   # создана 2026-08-10, регион WEUR

# Два триггера из пяти доступных: снимок с лесенкой раз в час, ретенция ночью.
[triggers]
crons = ["0 * * * *", "0 4 * * *"]

# ⚠️ ВЕШАТЬ НА СВОЙ ПОДДОМЕН, НЕ НА *.workers.dev: часть корпоративных и
# школьных сетей режет workers.dev целиком, а игра живёт в iframe чужих
# порталов, где сетью мы не управляем.
# Домен владельца заведён 2026-08-10, зона на Cloudflare (ainsley/randy.ns).
[[routes]]
pattern = "lb.blendo.monster"
custom_domain = true
